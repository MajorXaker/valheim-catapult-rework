name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Valheim server DLLs
        uses: actions/cache@v4
        with:
          path: |
            game
            .tools
          key: valheim-server-${{ github.run_id }}
          restore-keys: valheim-server-

      - name: Fetch Valheim dedicated server DLLs (anonymous Steam)
        run: ./scripts/fetch-server-dlls.sh

      - name: Test ballistics
        run: dotnet test tests/CatapultRework.Tests -c Release

      - name: Build mod
        run: dotnet build src/CatapultRework -c Release -p:VALHEIM_INSTALL=$PWD/game

      - name: Package for Thunderstore / r2modman
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CatapultRework
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
